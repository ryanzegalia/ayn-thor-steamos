# FatterPad Nintendo mode (thor/steamos-fatterpad): Proton hands a game the
# Thor's Switch Pro itself when that game has Steam Input off, so a game that
# ships Nintendo prompts draws them (Hades, 2026-10-14). The device only exists
# while FatterPad has a Nintendo-mode game in front; harmless otherwise.
# Read by systemd --user at login (steam.service inherits it).
PROTON_ENABLE_HIDRAW=0x057E/0x2009
